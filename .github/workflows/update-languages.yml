name: Atualizar linguagens do perfil

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/scripts/update_languages.py"
      - ".github/workflows/update-languages.yml"

permissions:
  contents: write

jobs:
  update-languages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar gráfico de linguagens
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_languages.py

      - name: Salvar atualização
        run: |
          if [ -z "$(git status --porcelain -- assets/languages.svg)" ]; then
            echo "Sem alterações nas linguagens."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg
          git commit -m "Atualiza gráfico de linguagens"
          git push
